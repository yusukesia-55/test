<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N5 漢字・語彙リスト — Nihongo by Yusuke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@600;800&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
@layer reset, base, components, utilities;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; }
}

@layer base {
  :root {
    color-scheme: light;
    --vermillion: oklch(0.58 0.21 33);          /* 朱 — 看板・鳥居の赤 */
    --ink: oklch(0.23 0.015 260);               /* 墨 */
    --bg: oklch(0.975 0.006 85);                /* 生成り */
    --surface: oklch(0.995 0.003 85);
    --muted: color-mix(in oklch, var(--ink) 52%, var(--bg));
    --border: color-mix(in oklch, var(--ink) 14%, transparent);
    --done: oklch(0.55 0.11 155);               /* 撮影済みの緑 */
    --done-bg: color-mix(in oklch, var(--done) 8%, var(--surface));

    --font-ui: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    --font-mincho: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    --font-hand: "Yusei Magic", sans-serif;

    --step--1: clamp(0.72rem, 0.7rem + 0.2vw, 0.8rem);
    --step-0: clamp(0.9rem, 0.85rem + 0.3vw, 1rem);
    --step-1: clamp(1.1rem, 1rem + 0.5vw, 1.3rem);
    --step-3: clamp(1.7rem, 1.4rem + 1.6vw, 2.4rem);
    --space: clamp(0.75rem, 0.5rem + 1.5vw, 1.25rem);
  }
  body {
    font-family: var(--font-ui);
    font-size: var(--step-0);
    background: var(--bg);
    background-image: radial-gradient(color-mix(in oklch, var(--ink) 4%, transparent) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: color-mix(in oklch, var(--vermillion) 25%, transparent); }
}

@layer components {
  .wrap { max-width: 44rem; margin-inline: auto; padding: var(--space); padding-block-end: 6rem; }

  /* ── ヘッダー ── */
  header { padding-block: calc(var(--space) * 1.2) var(--space); }
  .brand {
    font-size: var(--step--1);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--vermillion);
    font-weight: 700;
  }
  h1 {
    font-family: var(--font-mincho);
    font-weight: 800;
    font-size: var(--step-3);
    letter-spacing: 0.02em;
    line-height: 1.25;
    text-wrap: balance;
    margin-block-start: 0.35rem;
  }
  h1 .accent { color: var(--vermillion); }
  .lede { color: var(--muted); font-size: var(--step--1); margin-block-start: 0.5rem; max-width: 34rem; }

  /* ── 進捗バー ── */
  .progress {
    margin-block-start: var(--space);
    border: 1.5px solid var(--ink);
    background: var(--surface);
    padding: 0.7rem 0.9rem;
    display: grid;
    gap: 0.45rem;
    box-shadow: 4px 4px 0 color-mix(in oklch, var(--ink) 85%, transparent);
  }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
  .progress-label { font-size: var(--step--1); font-weight: 700; letter-spacing: 0.08em; }
  .progress-num { font-family: var(--font-mincho); font-weight: 800; font-size: var(--step-1); }
  .progress-num .of { font-size: var(--step--1); color: var(--muted); font-family: var(--font-ui); font-weight: 500; }
  .bar { height: 8px; background: color-mix(in oklch, var(--ink) 8%, transparent); overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: var(--vermillion); transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1); }

  /* ── タブ ── */
  .tabs {
    display: flex;
    gap: 0;
    margin-block-start: calc(var(--space) * 1.4);
    border: 1.5px solid var(--ink);
    background: var(--surface);
    position: sticky;
    top: 0.5rem;
    z-index: 20;
    box-shadow: 0 6px 16px -8px color-mix(in oklch, var(--ink) 40%, transparent);
  }
  .tab {
    flex: 1;
    padding: 0.65rem 0.5rem;
    font-weight: 700;
    font-size: var(--step-0);
    text-align: center;
    letter-spacing: 0.05em;
    border-inline-end: 1.5px solid var(--ink);
    transition: background 0.15s, color 0.15s;
    min-height: 44px;
  }
  .tab:last-child { border-inline-end: none; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .tab .count { font-size: var(--step--1); font-weight: 500; opacity: 0.65; margin-inline-start: 0.25em; }
  .tab:focus-visible { outline: 3px solid var(--vermillion); outline-offset: -3px; }

  /* ── ツールバー(検索+フィルタ) ── */
  .toolbar { margin-block-start: var(--space); display: grid; gap: 0.6rem; }
  .search {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: 16px; /* iOSズーム防止 */
  }
  .search:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 1px; border-color: transparent; }
  .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .chip {
    padding: 0.35rem 0.75rem;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: var(--step--1);
    font-weight: 500;
    min-height: 32px;
    transition: all 0.15s;
  }
  .chip[aria-pressed="true"] {
    background: var(--vermillion);
    border-color: var(--vermillion);
    color: white;
    font-weight: 700;
  }
  .chip:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 2px; }

  /* ── カテゴリーチップ(語彙) ── */
  .cats {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding-block-end: 0.3rem;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cats .chip { white-space: nowrap; flex-shrink: 0; }

  /* ── セクション見出し ── */
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-block: calc(var(--space) * 1.6) 0.7rem;
    padding-block-end: 0.4rem;
    border-block-end: 1.5px solid var(--ink);
  }
  .sec-head h2 { font-family: var(--font-mincho); font-weight: 800; font-size: var(--step-1); }
  .sec-head .sec-count { font-size: var(--step--1); color: var(--muted); }

  /* ── 漢字カード ── */
  .kanji-grid { display: grid; gap: 0.6rem; }
  .kanji-card {
    border: 1.5px solid var(--border);
    background: var(--surface);
    padding: 0.8rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.8rem;
    align-items: start;
    transition: background 0.2s, border-color 0.2s;
  }
  .kanji-card:has(.check:checked) { background: var(--done-bg); border-color: color-mix(in oklch, var(--done) 45%, transparent); }
  .kanji-faces { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; }
  .face-main {
    font-family: var(--font-mincho);
    font-weight: 800;
    font-size: 2.6rem;
    line-height: 1.1;
  }
  .face-alts { display: flex; gap: 0.35rem; color: var(--muted); }
  .face-alts span { font-size: 1.05rem; line-height: 1.2; }
  .face-go { font-family: var(--font-ui); font-weight: 900; }
  .face-hand { font-family: var(--font-hand); }
  .kanji-body { min-width: 0; }
  .kanji-reading { font-size: var(--step--1); color: var(--muted); letter-spacing: 0.03em; }
  .kanji-meaning { font-weight: 700; font-size: var(--step-0); }
  .kanji-hint {
    margin-block-start: 0.35rem;
    font-size: var(--step--1);
    color: var(--ink);
    background: color-mix(in oklch, var(--vermillion) 7%, transparent);
    border-inline-start: 3px solid var(--vermillion);
    padding: 0.25rem 0.5rem;
    line-height: 1.5;
  }
  .kanji-hint::before { content: "📷 "; }

  /* ── チェックボックス ── */
  .check-wrap { display: grid; place-items: center; align-self: center; }
  .check {
    appearance: none;
    width: 30px; height: 30px;
    border: 2px solid var(--ink);
    background: var(--surface);
    display: grid;
    place-content: center;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .check:checked { background: var(--done); border-color: var(--done); }
  .check:checked::before {
    content: "";
    width: 14px; height: 8px;
    border-inline-start: 3px solid white;
    border-block-end: 3px solid white;
    transform: rotate(-45deg) translateY(-2px);
  }
  .check:focus-visible { outline: 3px solid var(--vermillion); outline-offset: 2px; }

  /* ── 語彙リスト ── */
  .vocab-cat { margin-block-start: calc(var(--space) * 1.3); }
  .vocab-cat-head {
    display: flex; align-items: baseline; gap: 0.5rem;
    padding: 0.45rem 0.7rem;
    background: var(--ink);
    color: var(--bg);
  }
  .vocab-cat-head h3 { font-size: var(--step-0); font-weight: 700; letter-spacing: 0.06em; }
  .vocab-cat-head .n { font-size: var(--step--1); opacity: 0.7; }
  .vocab-rows { border: 1.5px solid var(--border); border-block-start: none; background: var(--surface); }
  .vocab-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.6rem;
    align-items: center;
    padding: 0.55rem 0.7rem;
    border-block-end: 1px solid var(--border);
    transition: background 0.2s;
  }
  .vocab-row:last-child { border-block-end: none; }
  .vocab-row:has(.check:checked) { background: var(--done-bg); }
  .vocab-row .check { width: 26px; height: 26px; }
  .vocab-row .check:checked::before { width: 12px; height: 7px; }
  .vocab-main { min-width: 0; }
  .vocab-word { font-weight: 700; font-size: var(--step-0); }
  .vocab-word .cam { font-size: 0.8em; margin-inline-start: 0.3em; }
  .vocab-sub { font-size: var(--step--1); color: var(--muted); }
  .vocab-sub .en { margin-inline-start: 0.5em; }

  /* ── 空状態 ── */
  .empty { text-align: center; color: var(--muted); padding-block: 2.5rem; font-size: var(--step--1); display: none; }

  /* ── フッター ── */
  footer {
    margin-block-start: calc(var(--space) * 2);
    padding-block-start: var(--space);
    border-block-start: 1.5px solid var(--border);
    font-size: var(--step--1);
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .reset-btn {
    font-size: var(--step--1);
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }
  .reset-btn:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 2px; }

  .hidden { display: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation-duration: 0.01ms !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="brand">Nihongo by Yusuke — 素材収集用</p>
  <h1>N5 漢字<span class="accent">108</span>字・語彙<span class="accent">440</span>語</h1>
  <p class="lede">街で撮る漢字・語彙のチェックリスト。漢字は明朝・ゴシック・手書き風の3書体で表示(実物のフォント揺れに備える)。チェックはこの端末に保存されます。</p>
</header>

<div class="progress" role="status">
  <div class="progress-row">
    <span class="progress-label" id="progressLabel">撮影済み</span>
    <span class="progress-num"><span id="doneCount">0</span><span class="of"> / <span id="totalCount">0</span></span></span>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
</div>

<div class="tabs" role="tablist" aria-label="リスト切り替え">
  <button class="tab" role="tab" id="tabKanji" aria-selected="true" aria-controls="panelKanji">漢字<span class="count" id="kanjiTabCount"></span></button>
  <button class="tab" role="tab" id="tabVocab" aria-selected="false" aria-controls="panelVocab">語彙<span class="count" id="vocabTabCount"></span></button>
</div>

<div class="toolbar">
  <input type="search" class="search" id="searchBox" placeholder="検索(漢字・読み・英語)" aria-label="検索">
  <div class="filters" role="group" aria-label="撮影状態フィルタ">
    <button class="chip" data-filter="all" aria-pressed="true">すべて</button>
    <button class="chip" data-filter="todo" aria-pressed="false">未撮影</button>
    <button class="chip" data-filter="done" aria-pressed="false">撮影済み</button>
  </div>
  <div class="cats hidden" id="catBar" role="group" aria-label="語彙カテゴリー"></div>
</div>

<main>
  <section id="panelKanji" role="tabpanel" aria-labelledby="tabKanji">
    <div class="sec-head"><h2>漢字</h2><span class="sec-count" id="kanjiShown"></span></div>
    <div class="kanji-grid" id="kanjiGrid"></div>
    <p class="empty" id="kanjiEmpty">該当なし</p>
  </section>

  <section id="panelVocab" role="tabpanel" aria-labelledby="tabVocab" class="hidden">
    <div id="vocabList"></div>
    <p class="empty" id="vocabEmpty">該当なし</p>
  </section>
</main>

<footer>
  <span>NGY 撮影リスト v1 — 2026.07</span>
  <button class="reset-btn" id="resetBtn">チェックを全部リセット</button>
</footer>

</div>

<script>
/* ============ データ ============ */
/* 漢字: [字, 読み, 意味(EN), 街での撮影例] */
const KANJI = [
["一","いち / ひと","one","値札「一つ100円」、一丁目の住所表示板"],
["二","に / ふた","two","二丁目の街区表示、二階の案内"],
["三","さん / み","three","三丁目、三番線ホーム標識"],
["四","し・よん / よ","four","四つ角の交差点名、四番出口"],
["五","ご / いつ","five","五差路の標識、五番街の商店街看板"],
["六","ろく / む","six","六本木の駅名標、六号車の乗車位置"],
["七","しち・なな","seven","七福神めぐりの幟、七味唐辛子のパッケージ"],
["八","はち / や","eight","八百屋の看板、八重洲口の案内"],
["九","きゅう・く","nine","九段下の駅名標、九号線の標識"],
["十","じゅう / とお","ten","十字路標識、「十割そば」の看板"],
["百","ひゃく","hundred","100円ショップの「百円」表示、百貨店"],
["千","せん / ち","thousand","千円の値札、千代田区の区名標識"],
["万","まん","ten thousand","「一万円」の価格表示、質屋の看板"],
["円","えん","yen; circle","値札ならどこでも。手書きの「円」が狙い目"],
["日","にち・ひ","day; sun","定休日の貼り紙、「本日営業」の札"],
["月","げつ・つき","month; moon","月極駐車場の看板(定番)、月曜定休の表示"],
["火","か / ひ","fire","「火気厳禁」の標識、消火栓の表示"],
["水","すい / みず","water","「飲料水」の表示、水道局のマンホール"],
["木","もく / き","tree; wood","木曜定休の貼り紙、材木店の看板"],

["分","ふん・ぶん","minute; part","「駅から徒歩5分」の不動産広告"],
["半","はん","half","「9時半開店」、半額シール"],

["外","がい / そと","outside","「外出中」の札、屋外喫煙所の案内"],
["右","う / みぎ","right","「右折禁止」標識、右側通行の掲示"],
["左","さ / ひだり","left","「左折可」標識、左側通行の掲示"],
["東","とう / ひがし","east","東口の駅案内、東京の「東」"],
["西","せい / にし","west","西口の駅案内、関西方面の標識"],
["南","なん / みなみ","south","南口の案内、南向き物件の不動産広告"],
["北","ほく / きた","north","北口の案内、北海道物産展のPOP"],
["口","こう / くち","mouth; exit","「入口」「出口」「北口」あらゆる出入口"],
["出","しゅつ / で","exit; leave","「出口」の案内(定番)、出前の幟"],

["あいさつ・決まり文句", [

/* ============ 状態 ============ */
const memStore = {};
const store = {
  read() {
    try { return JSON.parse(localStorage.getItem("ngy-n5-checks") || "{}"); }
    catch (e) { return memStore; }
  },
  write(obj) {
    try { localStorage.setItem("ngy-n5-checks", JSON.stringify(obj)); }
    catch (e) { Object.assign(memStore, obj); }
  }
};
let checks = store.read();
let activeTab = "kanji";
let statusFilter = "all";
let activeCat = "all";
let query = "";

/* ============ ID ============ */
const kanjiItems = KANJI.map((k, i) => ({ id: "k" + i, char: k[0], reading: k[1], en: k[2], hint: k[3] }));
const vocabItems = [];
VOCAB.forEach(([cat, words], ci) => {
  words.forEach((w, wi) => {
    vocabItems.push({ id: "v" + ci + "-" + wi, cat, word: w[0], reading: w[1], en: w[2], cam: w[3] === 1 });
  });
});
const vocabCats = VOCAB.map(v => v[0]);

/* ============ 描画 ============ */
const $ = (s) => document.querySelector(s);
const kanjiGrid = $("#kanjiGrid");
const vocabList = $("#vocabList");
const catBar = $("#catBar");

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function matches(item, isKanji) {
  const q = query.trim().toLowerCase();
  if (q) {
    const hay = isKanji
      ? (item.char + item.reading + item.en + item.hint).toLowerCase()
      : (item.word + item.reading + item.en).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  const done = !!checks[item.id];
  if (statusFilter === "done" && !done) return false;
  if (statusFilter === "todo" && done) return false;
  return true;
}

function renderKanji() {
  const shown = kanjiItems.filter(k => matches(k, true));
  kanjiGrid.innerHTML = shown.map(k => `
    <article class="kanji-card">
      <div class="kanji-faces" aria-hidden="true">
        <span class="face-main">${esc(k.char)}</span>
        <span class="face-alts"><span class="face-go">${esc(k.char)}</span><span class="face-hand">${esc(k.char)}</span></span>
      </div>
      <div class="kanji-body">
        <p class="kanji-reading">${esc(k.reading)}</p>
        <p class="kanji-meaning">${esc(k.en)}</p>
        <p class="kanji-hint">${esc(k.hint)}</p>
      </div>
      <div class="check-wrap">
        <input type="checkbox" class="check" data-id="${k.id}" ${checks[k.id] ? "checked" : ""} aria-label="${esc(k.char)} を撮影済みにする">
      </div>
    </article>`).join("");
  $("#kanjiEmpty").style.display = shown.length ? "none" : "block";
  $("#kanjiShown").textContent = shown.length + "字を表示";
}

function renderVocab() {
  let total = 0;
  vocabList.innerHTML = vocabCats
    .filter(cat => activeCat === "all" || cat === activeCat)
    .map(cat => {
      const rows = vocabItems.filter(v => v.cat === cat && matches(v, false));
      if (!rows.length) return "";
      total += rows.length;
      return `
      <section class="vocab-cat">
        <div class="vocab-cat-head"><h3>${esc(cat)}</h3><span class="n">${rows.length}語</span></div>
        <div class="vocab-rows">
          ${rows.map(v => `
          <div class="vocab-row">
            <div class="vocab-main">
              <p class="vocab-word">${esc(v.word)}${v.cam ? '<span class="cam" title="街で撮れる">📷</span>' : ""}</p>
              <p class="vocab-sub">${esc(v.reading)}<span class="en">${esc(v.en)}</span></p>
            </div>
            <input type="checkbox" class="check" data-id="${v.id}" ${checks[v.id] ? "checked" : ""} aria-label="${esc(v.word)} を撮影済みにする">
          </div>`).join("")}
        </div>
      </section>`;
    }).join("");
  $("#vocabEmpty").style.display = total ? "none" : "block";
}

function renderProgress() {
  const pool = activeTab === "kanji" ? kanjiItems : vocabItems;
  const done = pool.filter(i => checks[i.id]).length;
  $("#doneCount").textContent = done;
  $("#totalCount").textContent = pool.length;
  $("#barFill").style.width = (pool.length ? (done / pool.length) * 100 : 0) + "%";
  $("#progressLabel").textContent = (activeTab === "kanji" ? "漢字" : "語彙") + " 撮影済み";
}

function renderAll() {
  if (activeTab === "kanji") renderKanji(); else renderVocab();
  renderProgress();
}

/* ============ イベント ============ */
document.addEventListener("change", (e) => {
  if (!e.target.classList.contains("check")) return;
  const id = e.target.dataset.id;
  if (e.target.checked) checks[id] = 1; else delete checks[id];
  store.write(checks);
  renderProgress();
});

$("#tabKanji").addEventListener("click", () => switchTab("kanji"));
$("#tabVocab").addEventListener("click", () => switchTab("vocab"));

function switchTab(tab) {
  activeTab = tab;
  $("#tabKanji").setAttribute("aria-selected", tab === "kanji");
  $("#tabVocab").setAttribute("aria-selected", tab === "vocab");
  $("#panelKanji").classList.toggle("hidden", tab !== "kanji");
  $("#panelVocab").classList.toggle("hidden", tab !== "vocab");
  catBar.classList.toggle("hidden", tab !== "vocab");
  renderAll();
}

document.querySelectorAll(".filters .chip").forEach(btn => {
  btn.addEventListener("click", () => {
    statusFilter = btn.dataset.filter;
    document.querySelectorAll(".filters .chip").forEach(b => b.setAttribute("aria-pressed", b === btn));
    renderAll();
  });
});

let debounce;
$("#searchBox").addEventListener("input", (e) => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { query = e.target.value; renderAll(); }, 120);
});

$("#resetBtn").addEventListener("click", () => {
  if (!confirm("すべてのチェックをリセットしますか?")) return;
  checks = {};
  store.write(checks);
  renderAll();
});

/* カテゴリーチップ */
catBar.innerHTML = ['<button class="chip" data-cat="all" aria-pressed="true">全カテゴリー</button>']
  .concat(vocabCats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="false">${esc(c)}</button>`)).join("");
catBar.querySelectorAll(".chip").forEach(btn => {
  btn.addEventListener("click", () => {
    activeCat = btn.dataset.cat;
    catBar.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b === btn));
    renderVocab();
  });
});

/* タブの件数 */
$("#kanjiTabCount").textContent = kanjiItems.length;
$("#vocabTabCount").textContent = vocabItems.length;

renderAll();
</script>
</body>
